<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แบบ ภ.ด.ส. 5 ออนไลน์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#667;--bd:#d5d9e0;--ac:#1d6fb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#1e2328;--tx:#e8eaed;--mut:#9aa;--bd:#38404a;--ac:#5aa9ec;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181c;--card:#1e2328;--tx:#e8eaed;--mut:#9aa;--bd:#38404a;--ac:#5aa9ec;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sarabun',system-ui,sans-serif;font-size:16px}
main{max-width:760px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.on{border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g label{display:block;font-size:13px;color:var(--mut)}
.g .w{grid-column:1/-1}
input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.item{border:1px dashed var(--bd);border-radius:8px;padding:10px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
canvas{width:100%;height:140px;border:1px solid var(--bd);border-radius:8px;background:#fff;touch-action:none;display:block}
.hint{font-size:13px;color:var(--mut);margin:4px 0}
#paper{font-family:'TH SarabunPSK','TH Sarabun PSK','THSarabunPSK','Sarabun',sans-serif;background:#fff;color:#000;padding:28px 32px;border:1px solid var(--bd);border-radius:4px;line-height:2.1;font-size:16px;overflow-wrap:anywhere}
#paper h1{text-align:right;font-size:1em;margin:0}
#paper .c{text-align:center}#paper .t{font-size:20px}
#paper .r{text-align:right}
#paper u{text-decoration:none;border-bottom:1px dotted #000;padding:0 4px}
#paper .i{text-indent:2em;margin:0}
#paper .sg{display:flex;justify-content:flex-end;margin-top:20px;line-height:1.6}#paper .sg>div{width:420px;text-align:center}#paper .sl{display:flex;align-items:flex-end}#paper .sl span:first-child{width:64px;text-align:left}#paper .sl span:last-child{width:140px;text-align:left}#paper .ln{flex:1;height:64px;border-bottom:1px dotted #000;position:relative;margin:0 4px}#paper .nm{display:flex;justify-content:center;white-space:nowrap;padding:0 140px 0 64px}

#paper .ln img{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);height:58px;max-width:100%}
.hid{display:none}
@page{size:A4;margin:14mm}
@media print{body{background:#fff}:root{padding:0}main>*:not(#pw){display:none!important}#paper{border:0;padding:0;font-size:13pt;line-height:1.8}#paper.psk{font-size:16pt}#paper .t{font-size:16pt}#paper.psk .t{font-size:20pt}#pw .row{display:none!important}}
</style>
</head>
<body>
<main>
<div class="tabs no"><button id="tc" class="on">ประชาชนกรอกข้อมูล</button><button id="to">เจ้าหน้าที่</button></div>
<div id="cit">
 <div class="card"><h2>ข้อมูลผู้แจ้ง</h2><div class="g" id="head"></div></div>
 <div id="lists"></div>
 <div class="card"><h2>ลายเซ็นผู้แจ้ง</h2>
  <p class="hint">เซ็นชื่อด้วยนิ้วในกรอบด้านล่าง</p>
  <canvas id="sig" width="640" height="280"></canvas>
  <div class="row"><button id="clr">ล้างลายเซ็น</button></div></div>
 <div class="card"><h2>ส่งข้อมูลให้เจ้าหน้าที่</h2>
  <p class="hint">กดสร้างรหัส แล้วคัดลอกส่งให้เจ้าหน้าที่ทางไลน์หรืออีเมล</p>
  <div class="row"><button class="p" id="mk">สร้างรหัสส่งเจ้าหน้าที่</button></div>
  <textarea id="code" rows="3" readonly class="hid"></textarea>
  <div class="row"><button id="cp" class="hid">คัดลอกรหัส</button></div></div>
</div>
<div id="off" class="hid">
 <div class="card"><h2>เจ้าหน้าที่: นำเข้าข้อมูลจากประชาชน</h2>
  <textarea id="inp" rows="3" placeholder="วางรหัสที่ประชาชนส่งมา (ขึ้นต้นด้วย PDS5:)"></textarea>
  <div class="row"><button class="p" id="ld">โหลดข้อมูล</button><span id="msg" class="hint"></span></div></div>
 <div class="card"><h2>ผู้รับแจ้ง</h2><div class="g" id="ofg"></div></div>
</div>
<div id="pw">
 <div class="row no" style="margin:0 0 8px"><button class="p" id="pr">พิมพ์ / บันทึกเป็น PDF</button></div>
 <div id="paper"></div>
</div>
</main>
<script>
const TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const AD=[['moo','หมู่ที่'],['road','ถนน'],['tambon','ตำบล'],['amphoe','อำเภอ'],['province','จังหวัด']];
const USE=[['old','เดิมใช้ประโยชน์ (เช่น ทำการเกษตร)','w'],['new','บัดนี้ใช้ประโยชน์ (เช่น ที่อยู่อาศัย)','w'],['date','ตั้งแต่วันที่','date']];
const T={
 land:{t:'ที่ดิน',u:'แปลง',f:[...AD,['deed','เลขที่โฉนด/หนังสือสำคัญ'],['rai','เนื้อที่ (ไร่)','number'],['ngan','งาน','number'],['wa','ตารางวา','number'],...USE]},
 build:{t:'สิ่งปลูกสร้าง',u:'หลัง',f:[...AD,['deed','บนที่ดินเลขที่โฉนด/หนังสือสำคัญ'],['area','ขนาดพื้นที่ (ตร.ม.)','number'],...USE]},
 condo:{t:'อาคารชุด/ห้องชุด',u:'ห้อง',f:[['cname','ชื่ออาคารชุด/ห้องชุด','w'],['room','เลขที่/ห้องที่'],...AD,['deed','บนที่ดินเลขที่โฉนด/หนังสือสำคัญ'],['area','ขนาดพื้นที่ (ตร.ม.)','number'],...USE]}
};
const fresh=()=>({place:'องค์การบริหารส่วนตำบลเวียงท่ากาน',date:'',name:'',house:'',moo:'',road:'',tambon:'',amphoe:'',province:'',land:[{}],build:[{}],condo:[{}],sig:'',oname:'',opos:''});
let s=fresh();
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const u=x=>`<u>${esc(x)||'&emsp;&emsp;&emsp;'}</u>`;
const dt=iso=>{if(!iso)return['','',''];const[y,m,d]=iso.split('-');return[+d,TH[m-1],+y+543]};
function inp(obj,k,label,type,cls){
 const d=document.createElement('div');if(cls)d.className=cls;
 const l=document.createElement('label');l.textContent=label;
 const i=document.createElement('input');i.type=type||'text';if(type==='number')i.inputMode='decimal';
 i.value=obj[k]||'';i.oninput=()=>{obj[k]=i.value;paper()};
 l.appendChild(i);d.appendChild(l);return d;
}
function buildHead(){
 const h=$('head');h.innerHTML='';
 [['place','เขียนที่','text','w'],['date','วันที่','date','w'],['name','ข้าพเจ้า (ชื่อ-นามสกุล)','text','w'],['house','บ้านเลขที่'],['moo','หมู่ที่'],['road','ถนน'],['tambon','ตำบล'],['amphoe','อำเภอ'],['province','จังหวัด']]
 .forEach(([k,l,t,c])=>h.appendChild(inp(s,k,l,t,c)));
 const o=$('ofg');o.innerHTML='';
 o.appendChild(inp(s,'oname','ชื่อเจ้าหน้าที่ผู้รับแจ้ง','text','w'));
 o.appendChild(inp(s,'opos','ตำแหน่ง','text','w'));
}
function buildLists(){
 const L=$('lists');L.innerHTML='';
 for(const k in T){
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<h2>${T[k].t} (${s[k].length} ${T[k].u})</h2><p class="hint">ถ้าไม่มี${T[k].t} ให้กด "ลบรายการนี้" หรือเว้นว่างไว้</p>`;
  s[k].forEach((it,n)=>{
   const b=document.createElement('div');b.className='item';
   b.innerHTML=`<b>${T[k].t}ที่ ${n+1}</b>`;
   const g=document.createElement('div');g.className='g';
   T[k].f.forEach(([f,l,t])=>g.appendChild(inp(it,f,l,t==='date'?'date':t==='number'?'number':'text',t==='w'?'w':'')));
   b.appendChild(g);
   const r=document.createElement('div');r.className='row';
   const x=document.createElement('button');x.textContent='ลบรายการนี้';
   x.onclick=()=>{s[k].splice(n,1);buildLists();paper()};
   r.appendChild(x);b.appendChild(r);c.appendChild(b);
  });
  const a=document.createElement('button');a.textContent='+ เพิ่ม'+T[k].t;
  a.onclick=()=>{s[k].push({});buildLists();paper()};
  c.appendChild(a);L.appendChild(c);
 }
}
function addr(o){return `หมู่ที่${u(o.moo)}ถนน${u(o.road)}ตำบล${u(o.tambon)}อำเภอ${u(o.amphoe)}จังหวัด${u(o.province)}`}
function since(o){const[d,m,y]=dt(o.date);return `ตั้งแต่วันที่${u(d)}เดือน${u(m)}พ.ศ.${u(y)}`}
const item={
 land:(o,n)=>`<p class="i">1.${n} แปลงที่${u(n)}ตั้งอยู่${addr(o)}เลขที่โฉนดหรือหนังสือสำคัญ${u(o.deed)}เนื้อที่ดิน${u(o.rai)}ไร่${u(o.ngan)}งาน${u(o.wa)}ตร.ว. เดิมที่ดินแปลงนี้ใช้ทำประโยชน์${u(o.old)}บัดนี้ที่ดินแปลงดังกล่าวใช้ทำประโยชน์${u(o.new)}${since(o)}</p>`,
 build:(o,n)=>`<p class="i">2.${n} หลังที่${u(n)}ตั้งอยู่${addr(o)}บนที่ดินเลขที่โฉนดหรือหนังสือสำคัญ${u(o.deed)}ขนาดพื้นที่สิ่งปลูกสร้าง${u(o.area)}ตร.ม. เดิมสิ่งปลูกสร้างนี้ใช้ทำประโยชน์${u(o.old)}บัดนี้สิ่งปลูกสร้างดังกล่าวใช้ทำประโยชน์${u(o.new)}${since(o)}</p>`,
 condo:(o,n)=>`<p class="i">3.${n} ชื่ออาคารชุด/ห้องชุด${u(o.cname)}เลขที่/ห้องที่${u(o.room)}ตั้งอยู่${addr(o)}บนที่ดินเลขที่โฉนดหรือหนังสือสำคัญ${u(o.deed)}ขนาดพื้นที่อาคารชุด/ห้องชุด${u(o.area)}ตร.ม. เดิมอาคารชุด/ห้องชุดนี้ใช้ทำประโยชน์${u(o.old)}บัดนี้อาคารชุด/ห้องชุดดังกล่าวใช้ทำประโยชน์${u(o.new)}${since(o)}</p>`
};
function paper(){
 const[d,m,y]=dt(s.date);let h=`<h1>ภ.ด.ส. 5</h1><div class="c t"><b>แบบแจ้งการเปลี่ยนแปลงการใช้ประโยชน์ในที่ดินหรือสิ่งปลูกสร้าง</b></div>
 <div class="r">เขียนที่${u(s.place)}</div><div class="r">วันที่${u(d)}เดือน${u(m)}พ.ศ.${u(y)}</div>
 <p class="i">ข้าพเจ้า${u(s.name)}อยู่บ้านเลขที่${u(s.house)}หมู่ที่${u(s.moo)}ถนน${u(s.road)}ตำบล${u(s.tambon)}อำเภอ${u(s.amphoe)}จังหวัด${u(s.province)}ขอยื่นแบบแจ้งการเปลี่ยนแปลงการใช้ประโยชน์ในที่ดินหรือสิ่งปลูกสร้างต่อองค์กรปกครองส่วนท้องถิ่น ดังมีข้อความต่อไปนี้</p><p class="i">ข้าพเจ้ามีทรัพย์สินประเภท</p>`;
 let no=0;
 for(const k in T){no++;const a=s[k].filter(o=>Object.values(o).some(v=>v));if(!a.length)continue;
  h+=`<p style="margin:0">${no}. ${T[k].t} จำนวน${u(a.length)}${T[k].u} ดังนี้</p>`;
  a.forEach((o,i)=>h+=item[k](o,i+1));}
 h+=`<div class="sg"><div><div class="sl"><span>(ลงชื่อ)</span><span class="ln">${s.sig?`<img src="${s.sig}" alt="">`:''}</span><span>ผู้แจ้ง</span></div><div class="nm">(${esc(s.name)||'.....................'})</div></div></div>
 <div class="sg"><div><div class="sl"><span>(ลงชื่อ)</span><span class="ln"></span><span>เจ้าหน้าที่ผู้รับแจ้ง</span></div><div class="nm">(${esc(s.oname)||'.....................'})</div><div class="nm">ตำแหน่ง ${esc(s.opos)||'.....................'}</div></div></div>`;
 $('paper').innerHTML=h;
}
// signature pad
const cv=$('sig'),cx=cv.getContext('2d');let dr=false;
cx.lineWidth=4;cx.lineCap='round';cx.strokeStyle='#000';
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.1,y+.1);cx.stroke()};
cv.onpointermove=e=>{if(!dr)return;const[x,y]=pt(e);cx.lineTo(x,y);cx.stroke()};
const end=()=>{if(!dr)return;dr=false;s.sig=cv.toDataURL('image/png');paper()};
cv.onpointerup=end;cv.onpointercancel=end;
$('clr').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);s.sig='';paper()};
// encode / decode
const enc=()=>'PDS5:'+btoa(unescape(encodeURIComponent(JSON.stringify(s))));
$('mk').onclick=()=>{const t=$('code');t.value=enc();t.classList.remove('hid');$('cp').classList.remove('hid');t.select()};
$('cp').onclick=async()=>{const t=$('code');t.select();try{await navigator.clipboard.writeText(t.value);$('cp').textContent='คัดลอกแล้ว'}catch(e){document.execCommand&&document.execCommand('copy')}};
$('ld').onclick=()=>{
 try{const v=$('inp').value.trim().replace(/^PDS5:/,'');
  s=Object.assign(fresh(),JSON.parse(decodeURIComponent(escape(atob(v)))));
  buildHead();buildLists();paper();$('msg').textContent='โหลดข้อมูลสำเร็จ ตรวจสอบแล้วกดพิมพ์ได้เลย';
 }catch(e){$('msg').textContent='รหัสไม่ถูกต้อง กรุณาคัดลอกมาให้ครบ'}
};
// tabs
function tab(o){$('cit').classList.toggle('hid',o);$('off').classList.toggle('hid',!o);$('tc').classList.toggle('on',!o);$('to').classList.toggle('on',o)}
$('tc').onclick=()=>tab(false);$('to').onclick=()=>tab(true);
$('pr').onclick=()=>{try{window.print()}catch(e){alert('กรุณาเปิดหน้านี้ในเบราว์เซอร์แล้วสั่งพิมพ์ (Ctrl+P)')}};
(function(){try{const c=document.createElement('canvas').getContext('2d'),t='ทดสอบ ABC กขค';c.font='40px monospace';const a=c.measureText(t).width;c.font='40px "TH SarabunPSK","TH Sarabun PSK","THSarabunPSK",monospace';if(c.measureText(t).width!==a)$('paper').classList.add('psk')}catch(e){}})();
buildHead();buildLists();paper();
</script>
</body>
</html>
